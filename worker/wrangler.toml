# The public API in front of the Python service on Cloud Run.
# Secrets (never in this file): wrangler secret put API_SHARED_SECRET
#                               wrangler secret put TURNSTILE_SECRET
name = "delphi-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[vars]
# Set API_URL to the Cloud Run service URL after the first deploy.
API_URL = "https://delphi-api-REPLACE.a.run.app"
# The Pages site, plus local development.
ALLOWED_ORIGINS = "https://delphi-rag.pages.dev,http://localhost:8788"

# 5 questions a minute per visitor.
[[ratelimits]]
name = "PER_IP"
namespace_id = "41001"
simple = { limit = 5, period = 60 }

# 3 questions a minute for the whole site: the Voyage free tier's limit.
[[ratelimits]]
name = "SITE"
namespace_id = "41002"
simple = { limit = 3, period = 60 }
